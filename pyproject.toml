[project]
name = "fluidsimulation"
version = "0.1.0"
description = "2D stable-fluids simulation with pygame"
readme = "README.md"
requires-python = ">=3.10,<3.13"

authors = [
    { name = "katerinArtem", email = "temakaterin@gmail.com" },
]

dependencies = [
    "pygame>=2.1,<3.0",
    "numpy>=1.24,<2.0",
    "numba>=0.57,<0.61",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"